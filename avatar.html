<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avatar Editor - Peblux</title>
    
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon"/>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,500,600,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            font-family: 'Source Sans Pro', sans-serif;
            background-color: #e3e3e3;
            margin: 0;
            padding-top: 40px;
        }
        .navbar-peblux {
            background-color: #0074bd;
            border: none;
            min-height: 40px;
            height: 40px;
        }
        .peblux-nav-logo {
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 20px;
            font-weight: 900;
            font-style: italic;
            color: #da291c;
            background: #fff;
            padding: 0px 7px;
            border: 2px solid #da291c;
            border-radius: 3px;
            margin-top: 5px;
            display: inline-block;
            text-decoration: none !important;
        }
        .navbar-peblux .nav > li > a {
            color: white;
            font-weight: 600;
            padding: 10px 15px;
        }
        .main-container {
            display: flex;
            min-height: calc(100vh - 40px);
        }
        .sidebar {
            width: 175px;
            background: #fff;
            border-right: 1px solid #d0d0d0;
            padding-top: 10px;
            flex-shrink: 0;
        }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li a {
            display: block; padding: 8px 15px; color: #191919; text-decoration: none; font-size: 15px;
        }
        .sidebar ul li a:hover, .sidebar ul li a.active {
            background-color: #f2f2f2; color: #0074bd; font-weight: 600;
        }
        .sidebar ul li a i { margin-right: 10px; width: 18px; text-align: center; }

        /* Editor 2016 Layout */
        .content-area {
            flex-grow: 1;
            padding: 25px 40px;
            max-width: 1050px;
        }
        .editor-title {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 20px;
            color: #191919;
        }
        .editor-grid {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        /* Palco 3D Esquerdo */
        .avatar-stage {
            width: 320px;
            background: #fff;
            border: 1px solid #d4d4d4;
            padding: 15px;
            text-align: center;
        }
        #avatar3DCanvas {
            width: 288px;
            height: 340px;
            background: radial-gradient(circle, #f7f7f7 30%, #dcdcdc 100%);
            border: 1px solid #e0e0e0;
            cursor: grab;
        }
        /* Painel Direito de Customização */
        .customization-panel {
            flex-grow: 1;
            background: #fff;
            border: 1px solid #d4d4d4;
            padding: 20px;
            min-width: 300px;
        }
        .part-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 15px;
        }
        .part-btn {
            padding: 6px 12px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        .part-btn.active {
            background: #0074bd;
            color: white;
            border-color: #0074bd;
        }
        .color-palette {
            display: grid;
            grid-template-columns: repeat(8, 36px);
            gap: 8px;
            margin-bottom: 25px;
        }
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .save-btn {
            background-color: #00b06f;
            color: white;
            border: none;
            padding: 10px 25px;
            font-weight: 600;
            font-size: 15px;
            border-radius: 3px;
            cursor: pointer;
        }
        .save-btn:hover { background-color: #00965d; }
    </style>
</head>
<body>

    <nav class="navbar navbar-peblux navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header">
                <a href="home.html" class="peblux-nav-logo">P</a>
            </div>
            <ul class="nav navbar-nav">
                <li><a href="#">Games</a></li>
                <li><a href="#">Catalog</a></li>
                <li><a href="#">Develop</a></li>
                <li><a href="#">PEBLUX+</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-container">
        <div class="sidebar">
            <ul>
                <li><a href="home.html"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="#"><i class="fa fa-user"></i> Profile</a></li>
                <li><a href="#"><i class="fa fa-envelope-o"></i> Messages</a></li>
                <li><a href="#"><i class="fa fa-users"></i> Friends</a></li>
                <li><a href="avatar.html" class="active"><i class="fa fa-male"></i> Avatar</a></li>
                <li><a href="#"><i class="fa fa-briefcase"></i> Inventory</a></li>
                <li><a href="#"><i class="fa fa-exchange"></i> Trade</a></li>
                <li><a href="#"><i class="fa fa-globe"></i> Groups</a></li>
                <li><a href="#"><i class="fa fa-comments-o"></i> Forum</a></li>
                <li><a href="#"><i class="fa fa-rss"></i> Blog</a></li>
            </ul>
        </div>

        <div class="content-area">
            <div class="editor-title">Avatar Editor</div>

            <div class="editor-grid">
                <!-- Boneco 3D Default (Estilo R6 2016) -->
                <div class="avatar-stage">
                    <div id="avatar3DCanvas"></div>
                    <small style="color: #777; display: block; margin-top: 8px;">Arraste para girar o avatar 3D</small>
                </div>

                <!-- Seletor de Cores do Corpo -->
                <div class="customization-panel">
                    <h4 style="margin-top:0; font-weight: 600;">Body Colors</h4>
                    <p style="color: #666; font-size: 13px;">Selecione uma parte do corpo e clique na cor desejada:</p>

                    <div class="part-selector">
                        <button class="part-btn active" onclick="selectPart('head', this)">Head</button>
                        <button class="part-btn" onclick="selectPart('torso', this)">Torso</button>
                        <button class="part-btn" onclick="selectPart('leftArm', this)">Left Arm</button>
                        <button class="part-btn" onclick="selectPart('rightArm', this)">Right Arm</button>
                        <button class="part-btn" onclick="selectPart('leftLeg', this)">Left Leg</button>
                        <button class="part-btn" onclick="selectPart('rightLeg', this)">Right Leg</button>
                    </div>

                    <div class="color-palette" id="colorPalette"></div>

                    <button class="save-btn" onclick="saveAvatarColors()">Save Avatar</button>
                    <button class="btn btn-default" style="margin-left: 10px;" onclick="resetDefaultNoob()">Reset Default</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Cores clássicas do Roblox (BrickColors)
        const brickColors = [
            '#F5CD30', '#9BA0A5', '#A4BD47', '#0D69AC', '#C4281C', '#FFFFFF', '#1B2A35', '#635F62',
            '#EAB892', '#CC8E69', '#A05F35', '#694028', '#F8D96D', '#4B974B', '#27462D', '#008F9C',
            '#527CAE', '#2154B9', '#6B327C', '#AA00AA', '#FF66CC', '#DA8541', '#E29B40', '#D7C59A'
        ];

        let selectedPart = 'head';
        let currentUserId = null;
        let avatarColors = {
            head: '#F5CD30',
            torso: '#9BA0A5',
            leftArm: '#F5CD30',
            rightArm: '#F5CD30',
            leftLeg: '#A4BD47',
            rightLeg: '#A4BD47'
        };

        // Monta paleta na tela
        const paletteDiv = document.getElementById('colorPalette');
        brickColors.forEach(hex => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = hex;
            swatch.onclick = () => applyColor(hex);
            paletteDiv.appendChild(swatch);
        });

        function selectPart(part, btn) {
            selectedPart = part;
            document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- CENA 3D DO BONECO DEFAULT ---
        const container = document.getElementById('avatar3DCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, 288 / 340, 0.1, 100);
        camera.position.set(1.8, 1.3, 4.6);
        camera.lookAt(0, 0.2, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(288, 340);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.78));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.42);
        dirLight.position.set(4, 6, 5);
        scene.add(dirLight);

        const avatarGroup = new THREE.Group();
        scene.add(avatarGroup);

        // Materiais das partes
        const mats = {
            torso: new THREE.MeshLambertMaterial({ color: avatarColors.torso }),
            leftArm: new THREE.MeshLambertMaterial({ color: avatarColors.leftArm }),
            rightArm: new THREE.MeshLambertMaterial({ color: avatarColors.rightArm }),
            leftLeg: new THREE.MeshLambertMaterial({ color: avatarColors.leftLeg }),
            rightLeg: new THREE.MeshLambertMaterial({ color: avatarColors.rightLeg })
        };

        // Função para desenhar o rosto clássico na cor atual da cabeça
        function createHeadMaterials(hexColor) {
            const faceCanvas = document.createElement('canvas');
            faceCanvas.width = 128; faceCanvas.height = 128;
            const ctx = faceCanvas.getContext('2d');
            ctx.fillStyle = hexColor;
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#111111';
            ctx.beginPath(); ctx.ellipse(46, 52, 6, 10, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(82, 52, 6, 10, 0, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 6; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(64, 68, 22, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();

            const tex = new THREE.CanvasTexture(faceCanvas);
            const sideMat = new THREE.MeshLambertMaterial({ color: hexColor });
            return [sideMat, sideMat, sideMat, sideMat, new THREE.MeshLambertMaterial({ map: tex }), sideMat];
        }

        // Cabeça
        const headMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.78, 24), createHeadMaterials(avatarColors.head));
        headMesh.position.set(0, 1.38, 0);
        headMesh.rotation.y = -Math.PI / 2;
        avatarGroup.add(headMesh);

        // Tronco
        const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 0.55), mats.torso);
        torsoMesh.position.set(0, 0.42, 0);
        avatarGroup.add(torsoMesh);

        // Braços
        const leftArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.52, 1.1, 0.55), mats.leftArm);
        leftArmMesh.position.set(-0.83, 0.42, 0);
        avatarGroup.add(leftArmMesh);

        const rightArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.52, 1.1, 0.55), mats.rightArm);
        rightArmMesh.position.set(0.83, 0.42, 0);
        avatarGroup.add(rightArmMesh);

        // Pernas
        const leftLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.53, 1.1, 0.55), mats.leftLeg);
        leftLegMesh.position.set(-0.28, -0.7, 0);
        avatarGroup.add(leftLegMesh);

        const rightLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.53, 1.1, 0.55), mats.rightLeg);
        rightLegMesh.position.set(0.28, -0.7, 0);
        avatarGroup.add(rightLegMesh);

        // Rotação com o mouse/toque
        let isDragging = false, prevX = 0;
        avatarGroup.rotation.y = -0.35; // Ângulo clássico da imagem

        container.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            avatarGroup.rotation.y += (e.clientX - prevX) * 0.015;
            prevX = e.clientX;
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        function applyColor(hex) {
            avatarColors[selectedPart] = hex;
            update3DMeshColors();
        }

        function update3DMeshColors() {
            headMesh.material = createHeadMaterials(avatarColors.head);
            mats.torso.color.set(avatarColors.torso);
            mats.leftArm.color.set(avatarColors.leftArm);
            mats.rightArm.color.set(avatarColors.rightArm);
            mats.leftLeg.color.set(avatarColors.leftLeg);
            mats.rightLeg.color.set(avatarColors.rightLeg);
        }

        function resetDefaultNoob() {
            avatarColors = {
                head: '#F5CD30',
                torso: '#9BA0A5',
                leftArm: '#F5CD30',
                rightArm: '#F5CD30',
                leftLeg: '#A4BD47',
                rightLeg: '#A4BD47'
            };
            update3DMeshColors();
        }

        async function loadAvatar() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            currentUserId = session.user.id;

            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUserId).single();
            if (profile) {
                avatarColors = {
                    head: profile.head_color || '#F5CD30',
                    torso: profile.torso_color || '#9BA0A5',
                    leftArm: profile.left_arm_color || '#F5CD30',
                    rightArm: profile.right_arm_color || '#F5CD30',
                    leftLeg: profile.left_leg_color || '#A4BD47',
                    rightLeg: profile.right_leg_color || '#A4BD47'
                };
                update3DMeshColors();
            }
        }

        async function saveAvatarColors() {
            if (!currentUserId) return;
            const { error } = await supabaseClient
                .from('profiles')
                .update({
                    head_color: avatarColors.head,
                    torso_color: avatarColors.torso,
                    left_arm_color: avatarColors.leftArm,
                    right_arm_color: avatarColors.rightArm,
                    left_leg_color: avatarColors.leftLeg,
                    right_leg_color: avatarColors.rightLeg
                })
                .eq('id', currentUserId);

            if (error) {
                alert("Erro ao salvar avatar: " + error.message);
            } else {
                alert("Avatar salvo! Sua foto de perfil na Home já foi atualizada.");
            }
        }

        loadAvatar();
    </script>
</body>
</html>
