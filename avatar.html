<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avatar Editor - Peblux</title>
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon"/>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #e3e3e3; margin: 0; padding-top: 40px; }
        .navbar-peblux { background-color: #121212; border: none; min-height: 40px; height: 40px; border-bottom: 1px solid #000; }
        .peblux-nav-logo { font-family: 'Arial Black', Impact, sans-serif; font-size: 20px; font-weight: 900; font-style: italic; color: #da291c; background: #fff; padding: 0px 7px; border: 2px solid #da291c; border-radius: 3px; margin-top: 5px; display: inline-block; text-decoration: none !important; }
        .navbar-peblux .nav > li > a { color: white; font-weight: 600; padding: 10px 15px; font-size: 14px; }
        .navbar-peblux .nav > li > a:hover { background-color: #222; color: #0074bd; }
        .main-container { display: flex; min-height: calc(100vh - 40px); }
        .sidebar { width: 175px; background: #fff; border-right: 1px solid #d0d0d0; padding-top: 10px; flex-shrink: 0; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; padding: 8px 15px; color: #333; text-decoration: none; font-size: 14px; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background-color: #f2f2f2; color: #0074bd; font-weight: 600; }
        .sidebar ul li a i { margin-right: 10px; width: 18px; text-align: center; color: #555; }
        .content-area { flex-grow: 1; padding: 25px 40px; max-width: 1050px; }
        .editor-title { font-size: 28px; font-weight: 600; margin-bottom: 20px; color: #333; }
        .editor-grid { display: flex; gap: 25px; flex-wrap: wrap; }
        .avatar-stage { width: 320px; background: #fff; border: 1px solid #ccc; padding: 15px; text-align: center; border-radius: 4px; }
        #avatar3DCanvas { width: 288px; height: 340px; background: radial-gradient(circle, #f7f7f7 30%, #dcdcdc 100%); border: 1px solid #e0e0e0; cursor: grab; }
        .customization-panel { flex-grow: 1; background: #fff; border: 1px solid #ccc; padding: 20px; min-width: 300px; border-radius: 4px; }
        .part-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid #e0e0e0; padding-bottom: 15px; }
        .part-btn { padding: 6px 12px; border: 1px solid #ccc; background: #f9f9f9; cursor: pointer; font-weight: 600; font-size: 13px; }
        .part-btn.active { background: #0074bd; color: white; border-color: #0074bd; }
        .color-palette { display: grid; grid-template-columns: repeat(8, 36px); gap: 8px; margin-bottom: 25px; }
        .color-swatch { width: 36px; height: 36px; border-radius: 3px; cursor: pointer; border: 1px solid rgba(0,0,0,0.2); }
        .save-btn { background-color: #00b06f; color: white; border: none; padding: 10px 25px; font-weight: 600; font-size: 15px; border-radius: 3px; cursor: pointer; }
        .save-btn:hover { background-color: #00965d; }
        .inventory-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .inv-item { width: 70px; height: 70px; border: 1px solid #ccc; background: #f9f9f9; cursor: pointer; padding: 5px; text-align: center; flex-shrink: 0; border-radius: 3px; }
        .inv-item img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <nav class="navbar navbar-peblux navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header"><a href="home.html" class="peblux-nav-logo">P</a></div>
            <ul class="nav navbar-nav">
                <li><a href="home.html">Games</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="develop.html">Develop</a></li>
                <li><a href="buildersclub.html">PEBLUX+</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-container">
        <div class="sidebar">
            <ul>
                <li><a href="home.html"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="profile.html"><i class="fa fa-user"></i> Profile</a></li>
                <li><a href="messages.html"><i class="fa fa-envelope-o"></i> Messages</a></li>
                <li><a href="friends.html"><i class="fa fa-users"></i> Friends</a></li>
                <li><a href="avatar.html" class="active"><i class="fa fa-male"></i> Avatar</a></li>
                <li><a href="inventory.html"><i class="fa fa-briefcase"></i> Inventory</a></li>
            </ul>
        </div>

        <div class="content-area">
            <div class="editor-title">Avatar Editor</div>
            <div class="editor-grid">
                <div class="avatar-stage">
                    <div id="avatar3DCanvas"></div>
                    <small style="color: #777; display: block; margin-top: 8px;">Arraste para girar o avatar 3D</small>
                </div>
                <div class="customization-panel">
                    <h4 style="margin-top:0; font-weight: 600;">Body Colors</h4>
                    <div class="part-selector">
                        <button class="part-btn active" onclick="selectPart('head', this)">Head</button>
                        <button class="part-btn" onclick="selectPart('torso', this)">Torso</button>
                        <button class="part-btn" onclick="selectPart('leftArm', this)">Left Arm</button>
                        <button class="part-btn" onclick="selectPart('rightArm', this)">Right Arm</button>
                        <button class="part-btn" onclick="selectPart('leftLeg', this)">Left Leg</button>
                        <button class="part-btn" onclick="selectPart('rightLeg', this)">Right Leg</button>
                    </div>
                    <div class="color-palette" id="colorPalette"></div>

                    <h4 style="font-weight: 600; margin-top: 20px;">Equipped Shirt</h4>
                    <div class="inventory-list" id="shirtInventory">
                        <p style="color:#777; font-size:13px;">Carregando camisas...</p>
                    </div>

                    <br>
                    <button class="save-btn" onclick="saveAvatar()">Save Avatar</button>
                    <button class="btn btn-default" style="margin-left: 10px;" onclick="resetDefaultNoob()">Reset Default</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let avatarColors = { head: '#F5CD30', torso: '#9BA0A5', leftArm: '#F5CD30', rightArm: '#F5CD30', leftLeg: '#A4BD47', rightLeg: '#A4BD47' };
        const brickColors = ['#F5CD30', '#9BA0A5', '#A4BD47', '#0D69AC', '#C4281C', '#FFFFFF', '#1B2A35', '#635F62', '#EAB892', '#CC8E69', '#A05F35', '#694028', '#F8D96D', '#4B974B', '#27462D', '#008F9C', '#527CAE', '#2154B9', '#6B327C', '#AA00AA', '#FF66CC', '#DA8541', '#E29B40', '#D7C59A'];
        let selectedPart = 'head';
        let currentUserId = null;
        let equippedShirtURL = '';

        const paletteDiv = document.getElementById('colorPalette');
        brickColors.forEach(hex => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = hex;
            swatch.onclick = () => { avatarColors[selectedPart] = hex; buildAvatar(); };
            paletteDiv.appendChild(swatch);
        });

        function selectPart(part, btn) {
            selectedPart = part;
            document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const container = document.getElementById('avatar3DCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, 288 / 340, 0.1, 100);
        camera.position.set(1.8, 1.3, 4.6);
        camera.lookAt(0, 0.2, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(288, 340);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(4, 6, 5);
        scene.add(dirLight);

        const avatarGroup = new THREE.Group();
        scene.add(avatarGroup);

        function createHeadMaterial(hexColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = hexColor;
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#111111';
            ctx.beginPath(); ctx.ellipse(44, 50, 5, 9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(84, 50, 5, 9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 5; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(64, 66, 20, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshLambertMaterial({ color: hexColor });
            return [mat, mat, mat, mat, new THREE.MeshLambertMaterial({ map: texture }), mat];
        }

        function buildAvatar() {
            while(avatarGroup.children.length > 0){ avatarGroup.remove(avatarGroup.children[0]); }

            // Cabeça perfeitamente conectada no topo do torso
            const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.75, 0.75), createHeadMaterial(avatarColors.head));
            headMesh.position.set(0, 1.32, 0);
            avatarGroup.add(headMesh);

            // Tronco
            const torsoMat = new THREE.MeshLambertMaterial({ color: avatarColors.torso });
            if (equippedShirtURL) {
                const shirtImg = new Image();
                shirtImg.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 128; canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(shirtImg, 16, 16, 32, 32, 0, 0, 128, 128);
                    torsoMat.map = new THREE.CanvasTexture(canvas);
                    torsoMat.needsUpdate = true;
                };
                shirtImg.src = equippedShirtURL;
            }
            const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 0.55), torsoMat);
            torsoMesh.position.set(0, 0.42, 0);
            avatarGroup.add(torsoMesh);

            // Braços
            const armGeo = new THREE.BoxGeometry(0.52, 1.1, 0.55);
            const leftArm = new THREE.Mesh(armGeo, new THREE.MeshLambertMaterial({ color: avatarColors.leftArm }));
            leftArm.position.set(-0.83, 0.42, 0);
            avatarGroup.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, new THREE.MeshLambertMaterial({ color: avatarColors.rightArm }));
            rightArm.position.set(0.83, 0.42, 0);
            avatarGroup.add(rightArm);

            // Pernas
            const legGeo = new THREE.BoxGeometry(0.52, 1.1, 0.55);
            const leftLeg = new THREE.Mesh(legGeo, new THREE.MeshLambertMaterial({ color: avatarColors.leftLeg }));
            leftLeg.position.set(-0.29, -0.72, 0);
            avatarGroup.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, new THREE.MeshLambertMaterial({ color: avatarColors.rightLeg }));
            rightLeg.position.set(0.29, -0.72, 0);
            avatarGroup.add(rightLeg);
        }

        let isDragging = false, prevX = 0;
        avatarGroup.rotation.y = -0.35;
        container.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            avatarGroup.rotation.y += (e.clientX - prevX) * 0.015;
            prevX = e.clientX;
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        async function loadUserData() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            currentUserId = session.user.id;

            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUserId).single();
            if (profile) {
                avatarColors = {
                    head: profile.head_color || '#F5CD30',
                    torso: profile.torso_color || '#9BA0A5',
                    leftArm: profile.left_arm_color || '#F5CD30',
                    rightArm: profile.right_arm_color || '#F5CD30',
                    leftLeg: profile.left_leg_color || '#A4BD47',
                    rightLeg: profile.right_leg_color || '#A4BD47'
                };
                equippedShirtURL = profile.equipped_shirt || '';
            }
            buildAvatar();

            const { data: items } = await supabaseClient.from('items').select('*');
            const invDiv = document.getElementById('shirtInventory');
            if (!items || items.length === 0) {
                invDiv.innerHTML = `<p style="color:#777; font-size:13px;">Nenhuma camisa no catálogo ainda.</p>`;
                return;
            }

            invDiv.innerHTML = `
                <div class="inv-item" onclick="equipShirt('')" title="Sem camisa">
                    <div style="font-size:10px; line-height:55px;">Nenhuma</div>
                </div>
            ` + items.map(item => `
                <div class="inv-item" onclick="equipShirt('${item.image_url}')" title="${item.name}">
                    <img src="${item.image_url}" alt="${item.name}">
                </div>
            `).join('');
        }

        function equipShirt(url) {
            equippedShirtURL = url;
            buildAvatar();
        }

        function resetDefaultNoob() {
            avatarColors = { head: '#F5CD30', torso: '#9BA0A5', leftArm: '#F5CD30', rightArm: '#F5CD30', leftLeg: '#A4BD47', rightLeg: '#A4BD47' };
            equippedShirtURL = '';
            buildAvatar();
        }

        async function saveAvatar() {
            const { error } = await supabaseClient.from('profiles').update({
                head_color: avatarColors.head,
                torso_color: avatarColors.torso,
                left_arm_color: avatarColors.leftArm,
                right_arm_color: avatarColors.rightArm,
                left_leg_color: avatarColors.leftLeg,
                right_leg_color: avatarColors.rightLeg,
                equipped_shirt: equippedShirtURL
            }).eq('id', currentUserId);

            if (error) alert("Erro ao salvar: " + error.message);
            else alert("Avatar salvo com sucesso!");
        }

        loadUserData();
    </script>
</body>
</html>
