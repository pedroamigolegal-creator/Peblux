<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Messages - Peblux</title>
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon"/>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #e3e3e3; margin: 0; padding-top: 40px; }
        .navbar-peblux { background-color: #0074bd; border: none; min-height: 40px; height: 40px; }
        .peblux-nav-logo { font-family: 'Arial Black', Impact, sans-serif; font-size: 20px; font-weight: 900; font-style: italic; color: #da291c; background: #fff; padding: 0px 7px; border: 2px solid #da291c; border-radius: 3px; margin-top: 5px; display: inline-block; text-decoration: none !important; }
        .navbar-peblux .nav > li > a { color: white; font-weight: 600; padding: 10px 15px; }
        .main-container { display: flex; min-height: calc(100vh - 40px); }
        .sidebar { width: 175px; background: #fff; border-right: 1px solid #d0d0d0; padding-top: 10px; flex-shrink: 0; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; padding: 8px 15px; color: #191919; text-decoration: none; font-size: 15px; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background-color: #f2f2f2; color: #0074bd; font-weight: 600; }
        .sidebar ul li a i { margin-right: 10px; width: 18px; text-align: center; }
        .content-area { flex-grow: 1; padding: 25px 40px; max-width: 1000px; }
        .msg-table { background: #fff; border: 1px solid #ccc; width: 100%; border-radius: 4px; }
        .msg-table th { background: #f5f5f5; padding: 12px; border-bottom: 1px solid #ccc; }
        .msg-table td { padding: 12px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <nav class="navbar navbar-peblux navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header"><a href="home.html" class="peblux-nav-logo">P</a></div>
            <ul class="nav navbar-nav">
                <li><a href="home.html">Games</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="develop.html">Develop</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-container">
        <div class="sidebar">
            <ul>
                <li><a href="home.html"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="profile.html"><i class="fa fa-user"></i> Profile</a></li>
                <li><a href="messages.html" class="active"><i class="fa fa-envelope-o"></i> Messages</a></li>
                <li><a href="friends.html"><i class="fa fa-users"></i> Friends</a></li>
                <li><a href="avatar.html"><i class="fa fa-male"></i> Avatar</a></li>
            </ul>
        </div>

        <div class="content-area">
            <h2 style="font-weight:300; margin-bottom:20px;">Messages</h2>
            <table class="msg-table">
                <thead>
                    <tr><th>Sender</th><th>Subject</th><th>Date</th></tr>
                </thead>
                <tbody id="messagesList">
                    <tr><td colspan="3" style="text-align:center; color:#777;">Loading messages...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadMessages() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const { data: messages } = await supabaseClient.from('messages').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
            
            const tbody = document.getElementById('messagesList');
            if (!messages || messages.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#777;">No messages found.</td></tr>`;
                return;
            }

            tbody.innerHTML = messages.map(m => `
                <tr>
                    <td><strong>${m.sender}</strong></td>
                    <td><strong>${m.subject}</strong><br><span style="color:#555; font-size:13px;">${m.body}</span></td>
                    <td style="color:#888; font-size:12px;">${new Date(m.created_at).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        loadMessages();
    </script>
</body>
</html>
