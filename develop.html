<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Develop - Peblux</title>
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon"/>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #e3e3e3; margin: 0; padding-top: 40px; }
        .navbar-peblux { background-color: #0074bd; border: none; min-height: 40px; height: 40px; }
        .peblux-nav-logo { font-family: 'Arial Black', Impact, sans-serif; font-size: 20px; font-weight: 900; font-style: italic; color: #da291c; background: #fff; padding: 0px 7px; border: 2px solid #da291c; border-radius: 3px; margin-top: 5px; display: inline-block; text-decoration: none !important; }
        .navbar-peblux .nav > li > a { color: white; font-weight: 600; padding: 10px 15px; }
        .main-container { display: flex; min-height: calc(100vh - 40px); }
        .sidebar { width: 175px; background: #fff; border-right: 1px solid #d0d0d0; padding-top: 10px; flex-shrink: 0; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; padding: 8px 15px; color: #191919; text-decoration: none; font-size: 15px; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background-color: #f2f2f2; color: #0074bd; font-weight: 600; }
        .sidebar ul li a i { margin-right: 10px; width: 18px; text-align: center; }
        .content-area { flex-grow: 1; padding: 25px 40px; max-width: 900px; }
        .form-card { background: #fff; border: 1px solid #ccc; padding: 25px; border-radius: 4px; }
        .btn-green { background-color: #00b06f; color: white; font-weight: bold; border: none; padding: 8px 20px; }
        .btn-green:hover { background-color: #00965d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-peblux navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header"><a href="home.html" class="peblux-nav-logo">P</a></div>
            <ul class="nav navbar-nav">
                <li><a href="home.html">Games</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="develop.html" class="active" style="background:#005f99;">Develop</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-container">
        <div class="sidebar">
            <ul>
                <li><a href="home.html"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="profile.html"><i class="fa fa-user"></i> Profile</a></li>
                <li><a href="develop.html" class="active"><i class="fa fa-cogs"></i> Develop</a></li>
                <li><a href="catalog.html"><i class="fa fa-shopping-cart"></i> Catalog</a></li>
            </ul>
        </div>

        <div class="content-area">
            <h2 style="font-weight:300; margin-bottom:20px;">Create Shirt / Clothing</h2>
            <div class="form-card">
                <form id="uploadForm" onsubmit="handleUpload(event)">
                    <div class="form-group">
                        <label>Clothing Name</label>
                        <input type="text" id="itemName" class="form-control" required placeholder="Ex: Cool Blue Shirt">
                    </div>
                    <div class="form-group">
                        <label>Upload Template (.png)</label>
                        <input type="file" id="itemFile" accept="image/png" class="form-control" required onchange="previewTemplate(event)">
                    </div>
                    <div class="form-group text-center">
                        <canvas id="previewCanvas" width="150" height="150" style="border:1px solid #ccc; background:#f9f9f9; border-radius:4px; display:none;"></canvas>
                        <p id="analysisText" style="color:#00b06f; font-size:13px; font-weight:600; margin-top:5px;"></p>
                    </div>
                    <div class="form-group">
                        <label>Price in Robux (Sem vírgula)</label>
                        <input type="number" id="itemPrice" class="form-control" value="10" min="0" step="1" required>
                        <small style="color:#666;">Nota: 30% das vendas vão automaticamente para a conta da Plataforma (Peblux).</small>
                    </div>
                    <button type="submit" class="btn btn-green">Upload Asset</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            currentUser = session.user;
        }
        init();

        let formattedImageURL = '';

        function previewTemplate(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('previewCanvas');
                    canvas.style.display = 'block';
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0,0,150,150);
                    ctx.drawImage(img, 0, 0, 150, 150);
                    
                    formattedImageURL = e.target.result;
                    document.getElementById('analysisText').innerText = "✓ Template analisada e formatada com sucesso para o boneco!";
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        async function handleUpload(event) {
            event.preventDefault();
            const name = document.getElementById('itemName').value;
            const price = parseInt(document.getElementById('itemPrice').value);

            if (!formattedImageURL) {
                alert("Por favor, envie uma imagem válida.");
                return;
            }

            const { data: profile } = await supabaseClient.from('profiles').select('username').eq('id', currentUser.id).single();
            const creatorName = profile ? profile.username : 'Unknown';

            const { error } = await supabaseClient.from('items').insert([{
                creator_id: currentUser.id,
                creator_name: creatorName,
                name: name,
                type: 'Shirt',
                image_url: formattedImageURL,
                price: price,
                sales: 0
            }]);

            if (error) {
                alert("Erro ao fazer upload: " + error.message);
            } else {
                alert("Roupa criada com sucesso! O criador já a possui automaticamente.");
                window.location.href = "catalog.html";
            }
        }
    </script>
</body>
</html>
