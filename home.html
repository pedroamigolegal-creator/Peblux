<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Peblux</title>
    <link href="40052.png" rel="icon" type="image/png" />
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Supabase, Three.js e o GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #e3e3e3; margin: 0; padding-top: 45px; }
        
        .navbar-peblux { background-color: #0074BD; border: none; min-height: 45px; height: 45px; border-bottom: 1px solid #005691; }
        .peblux-nav-logo { height: 32px; margin-top: 6px; margin-left: 10px; display: inline-block; }
        .navbar-peblux .nav > li > a { color: white; font-weight: 600; padding: 12px 15px; font-size: 15px; }
        .navbar-peblux .nav > li > a:hover { background: rgba(25,25,25,0.15); border-radius: 4px; color: white; }
        
        .nav-search-container { display: inline-flex; align-items: center; background: white; border-radius: 2px; padding: 2px 8px; margin-top: 6px; width: 240px; border: 1px solid #c3c3c3; }
        .nav-search-input { border: none; outline: none; width: 100%; font-size: 14px; background: transparent; }
        
        .currency-badge { color: white; font-weight: bold; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
        .currency-icon { width: 18px; height: 18px; vertical-align: middle; }

        .gear-btn { background: transparent; border: none; color: white; font-size: 18px; padding: 10px; cursor: pointer; }
        .gear-btn:hover { background: rgba(25,25,25,0.15); border-radius: 4px; }

        .main-container { display: flex; min-height: calc(100vh - 45px); }
        
        .sidebar { width: 180px; background: #f2f2f2; border-right: 1px solid #c3c3c3; padding-top: 10px; position: fixed; top: 45px; bottom: 0; left: 0; z-index: 100; }
        .sidebar-user { color: #1e1e1f; font-size: 17px; font-weight: 700; padding: 8px 15px; border-bottom: 2px solid #c3c3c3; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; padding: 8px 15px; color: #333; text-decoration: none; font-size: 15px; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background-color: rgba(25,25,25,0.08); color: #0074BD; font-weight: 600; border-radius: 4px; }
        .sidebar ul li a i { margin-right: 10px; width: 18px; text-align: center; color: #555; }
        .upgrade-btn { background-color: #01a2fd; color: white !important; text-align: center; margin: 15px 10px; border-radius: 4px; padding: 8px !important; font-weight: 600 !important; display: block; text-decoration: none; }
        .upgrade-btn:hover { background-color: #3ab8ff !important; }

        .content-area { margin-left: 180px; flex-grow: 1; padding: 25px; max-width: 1050px; }
        .profile-header-box { display: flex; align-items: center; background: #fff; border: 1px solid #c3c3c3; padding: 25px; border-radius: 4px; box-shadow: 0 1px 4px rgba(25,25,25,0.1); margin-bottom: 20px; }
        
        #headshotContainer { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle, #ffffff 30%, #cfcfcf 100%); border: 1px solid #b5b5b5; overflow: hidden; margin-right: 25px; flex-shrink: 0; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); position: relative; }
        #canvas3d { width: 100%; height: 100%; display: block; }
        
        .helloMessage { font-size: 38px; font-weight: 600; color: #333; margin: 0; }

        .section-box { background: #fff; border: 1px solid #c3c3c3; padding: 15px 20px; border-radius: 4px; box-shadow: 0 1px 4px rgba(25,25,25,0.1); margin-bottom: 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-size: 18px; font-weight: 600; color: #333; margin: 0; }
        .see-all-btn { background: #0074BD; color: white; border: none; padding: 4px 12px; border-radius: 3px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .friends-row { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 5px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-peblux navbar-fixed-top">
        <div class="container-fluid" style="padding-left: 5px; padding-right: 10px;">
            <div class="navbar-header" style="display: flex; align-items: center;">
                <a href="home.html">
                    <img src="40052.png" class="peblux-nav-logo" alt="Logo">
                </a>
            </div>
            <ul class="nav navbar-nav">
                <li><a href="home.html">Games</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="develop.html">Develop</a></li>
                <li>
                    <div class="nav-search-container">
                        <input type="text" class="nav-search-input" placeholder="Search">
                        <i class="fa fa-search" style="color: #666; cursor: pointer; padding-right: 4px;"></i>
                    </div>
                </li>
            </ul>
            <ul class="nav navbar-nav navbar-right" style="display: flex; align-items: center; margin-right: 0;">
                <li>
                    <div class="currency-badge">
                        <img src="robux.png" class="currency-icon" alt="Robux"> <span id="userRobux">150</span>
                    </div>
                </li>
                <li>
                    <div class="currency-badge" style="margin-right: 8px;">
                        <img src="tix.png" class="currency-icon" alt="Tix"> <span id="userTix">0</span>
                    </div>
                </li>
                <li>
                    <button class="gear-btn" onclick="handleLogout()" title="Log Out"><i class="fa fa-cog"></i></button>
                </li>
            </ul>
        </div>
    </nav>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-user" id="sidebarUsername">Player</div>
            <ul>
                <li><a href="home.html" class="active"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="profile.html"><i class="fa fa-user"></i> Profile</a></li>
                <li><a href="messages.html"><i class="fa fa-envelope-o"></i> Messages</a></li>
                <li><a href="friends.html"><i class="fa fa-users"></i> Friends</a></li>
                <li><a href="avatar.html"><i class="fa fa-male"></i> Avatar</a></li>
                <li><a href="inventory.html"><i class="fa fa-briefcase"></i> Inventory</a></li>
                <li><a href="trade.html"><i class="fa fa-exchange"></i> Trade</a></li>
                <li><a href="groups.html"><i class="fa fa-users"></i> Groups</a></li>
                <li><a href="blog.html"><i class="fa fa-bullhorn"></i> Blog</a></li>
                <li><a href="forums.html"><i class="fa fa-comments-o"></i> Forums</a></li>
                <li><a href="buildersclub.html" class="upgrade-btn">Upgrade Now</a></li>
            </ul>
        </div>

        <div class="content-area">
            <div class="profile-header-box">
                <div id="headshotContainer">
                    <canvas id="canvas3d"></canvas>
                </div>
                <div>
                    <h1 class="helloMessage" id="welcomeText">Hello, Player!</h1>
                </div>
            </div>

            <div class="section-box">
                <div class="section-header">
                    <h3 class="section-title">Friends (0)</h3>
                    <button class="see-all-btn">See All</button>
                </div>
                <div class="friends-row">
                    <div style="color: #777; font-size: 14px; padding: 10px 0;">You don't have any friends online right now.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadUserData() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;

            const user = session.user;
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();

            if (profile && profile.username) {
                document.getElementById('userRobux').innerText = profile.robux || 150;
                document.getElementById('welcomeText').innerText = `Hello, ${profile.username}!`;
                document.getElementById('sidebarUsername').innerText = profile.username;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }

        loadUserData();

        // Configuração do Three.js com GLTFLoader para o roblox-noob.glb
        const container = document.getElementById('headshotContainer');
        const canvas = document.getElementById('canvas3d');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Carregador do arquivo .glb
        const loader = new THREE.GLTFLoader();
        loader.load('roblox-noob.glb', function(gltf) {
            const model = gltf.scene;

            // Centraliza o modelo e ajusta o zoom para focar na cabeça/busto de lado
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            model.position.x = -center.x;
            model.position.y = -center.y - (size.y * 0.28); // Foco no headshot superior
            model.position.z = -center.z;

            // Rotação lateral clássica do avatar
            model.rotation.y = 0.5;

            scene.add(model);
            camera.position.z = size.y * 0.7;
        }, undefined, function(error) {
            console.error('Erro ao carregar o arquivo .glb:', error);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
