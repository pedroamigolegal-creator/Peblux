<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Peblux</title>
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon"/>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Supabase SDK e Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #e3e3e3; margin: 0; padding-top: 45px; }
        
        /* Navbar Superior Azul Clássica */
        .navbar-peblux { background-color: #0074BD; border: none; min-height: 40px; height: 45px; border-bottom: 1px solid #005691; }
        .peblux-nav-logo { font-family: 'Arial Black', Impact, sans-serif; font-size: 22px; font-weight: 900; font-style: italic; color: #da291c; background: #fff; padding: 2px 8px; border: 2px solid #da291c; border-radius: 3px; margin-top: 6px; display: inline-block; text-decoration: none !important; }
        .navbar-peblux .nav > li > a { color: white; font-weight: 600; padding: 12px 15px; font-size: 15px; }
        .navbar-peblux .nav > li > a:hover { background: rgba(25,25,25,0.1); border-radius: 4px; color: white; }
        
        .currency-container { color: white; font-weight: 600; line-height: 45px; margin-right: 15px; font-size: 15px; display: inline-flex; align-items: center; gap: 5px; }
        .gear-btn { background: transparent; border: none; color: white; font-size: 18px; padding: 10px; cursor: pointer; }

        .main-container { display: flex; min-height: calc(100vh - 45px); }
        
        /* Menu Lateral Esquerdo IDÊNTICO ao da Imagem */
        .sidebar { width: 180px; background: #f2f2f2; border-right: 1px solid #c3c3c3; padding-top: 10px; position: fixed; top: 45px; bottom: 0; left: 0; z-index: 100; }
        .sidebar-user { color: #1e1e1f; font-size: 17px; font-weight: 700; padding: 8px 15px; border-bottom: 2px solid #c3c3c3; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; padding: 8px 15px; color: #333; text-decoration: none; font-size: 15px; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background-color: rgba(25,25,25,0.08); color: #0074BD; font-weight: 600; border-radius: 4px; }
        .sidebar ul li a i { margin-right: 10px; width: 18px; text-align: center; color: #555; }
        .upgrade-btn { background-color: #01a2fd; color: white !important; text-align: center; margin: 15px 10px; border-radius: 4px; padding: 8px !important; font-weight: 600 !important; display: block; text-decoration: none; }
        .upgrade-btn:hover { background-color: #3ab8ff !important; }

        /* Área do Conteúdo Principal */
        .content-area { margin-left: 180px; flex-grow: 1; padding: 30px; max-width: 1050px; }
        .profile-header-box { display: flex; align-items: center; background: #fff; border: 1px solid #c3c3c3; padding: 30px; border-radius: 4px; box-shadow: 0 1px 4px rgba(25,25,25,0.1); }
        
        /* Círculo do Avatar */
        #headshotContainer { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle, #ffffff 40%, #d4d4d4 100%); border: 1px solid #c3c3c3; overflow: hidden; margin-right: 30px; flex-shrink: 0; box-shadow: 0 -5px 20px rgba(25,25,25,0.15); display: flex; align-items: center; justify-content: center; }
        .helloMessage { font-size: 40px; font-weight: 600; color: #333; margin: 0; }
    </style>
</head>
<body>
    <!-- Navbar Superior -->
    <nav class="navbar navbar-peblux navbar-fixed-top">
        <div class="container-fluid" style="padding-left: 15px; padding-right: 15px;">
            <div class="navbar-header">
                <a href="home.html" class="peblux-nav-logo">P</a>
            </div>
            <ul class="nav navbar-nav">
                <li><a href="home.html">Games</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="develop.html">Develop</a></li>
            </ul>
            <ul class="nav navbar-nav navbar-right" style="display: flex; align-items: center; margin-right: 0;">
                <li>
                    <div class="currency-container">
                        ROBUX <i class="fa fa-stop-circle" style="color:#00b06f; margin-left: 2px;"></i> <span id="userRobux">100</span>
                    </div>
                </li>
                <li>
                    <button class="gear-btn" onclick="handleLogout()" title="Log Out"><i class="fa fa-cog"></i></button>
                </li>
            </ul>
        </div>
    </nav>

    <div class="main-container">
        <!-- Menu Lateral Esquerdo Completo -->
        <div class="sidebar">
            <div class="sidebar-user" id="sidebarUsername">Player</div>
            <ul>
                <li><a href="home.html" class="active"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="profile.html"><i class="fa fa-user"></i> Profile</a></li>
                <li><a href="messages.html"><i class="fa fa-envelope-o"></i> Messages</a></li>
                <li><a href="friends.html"><i class="fa fa-users"></i> Friends</a></li>
                <li><a href="avatar.html"><i class="fa fa-male"></i> Avatar</a></li>
                <li><a href="inventory.html"><i class="fa fa-briefcase"></i> Inventory</a></li>
                <li><a href="trade.html"><i class="fa fa-exchange"></i> Trade</a></li>
                <li><a href="groups.html"><i class="fa fa-users"></i> Groups</a></li>
                <li><a href="blog.html"><i class="fa fa-bullhorn"></i> Blog</a></li>
                <li><a href="forums.html"><i class="fa fa-comments-o"></i> Forums</a></li>
                <li><a href="buildersclub.html" class="upgrade-btn">Upgrade Now</a></li>
            </ul>
        </div>

        <!-- Área Central (Apenas o Avatar e a mensagem "Hello, user!") -->
        <div class="content-area">
            <div class="profile-header-box">
                <div id="headshotContainer">
                    <i class="fa fa-user" style="font-size: 50px; color: #ccc;"></i>
                </div>
                <div>
                    <h1 class="helloMessage" id="welcomeText">Hello, Player!</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Integração com Supabase -->
    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadUserData() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const user = session.user;
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();

            if (profile) {
                document.getElementById('userRobux').innerText = profile.robux;
                document.getElementById('welcomeText').innerText = `Hello, ${profile.username}!`;
                document.getElementById('sidebarUsername').innerText = profile.username;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }

        loadUserData();
    </script>
</body>
</html>
