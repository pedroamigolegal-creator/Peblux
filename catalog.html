<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catalog - Peblux</title>
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon"/>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #e3e3e3; margin: 0; padding-top: 40px; }
        .navbar-peblux { background-color: #0074bd; border: none; min-height: 40px; height: 40px; }
        .peblux-nav-logo { font-family: 'Arial Black', Impact, sans-serif; font-size: 20px; font-weight: 900; font-style: italic; color: #da291c; background: #fff; padding: 0px 7px; border: 2px solid #da291c; border-radius: 3px; margin-top: 5px; display: inline-block; text-decoration: none !important; }
        .navbar-peblux .nav > li > a { color: white; font-weight: 600; padding: 10px 15px; }
        .main-container { display: flex; min-height: calc(100vh - 40px); }
        .sidebar { width: 175px; background: #fff; border-right: 1px solid #d0d0d0; padding-top: 10px; flex-shrink: 0; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; padding: 8px 15px; color: #191919; text-decoration: none; font-size: 15px; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background-color: #f2f2f2; color: #0074bd; font-weight: 600; }
        .sidebar ul li a i { margin-right: 10px; width: 18px; text-align: center; }
        .content-area { flex-grow: 1; padding: 25px 40px; max-width: 1100px; }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .item-card { background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 10px; text-align: center; cursor: pointer; text-decoration: none; color: #333; display: block; }
        .item-card:hover { border-color: #0074bd; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-decoration: none; }
        .item-card img { width: 120px; height: 120px; object-fit: contain; background: #f9f9f9; border: 1px solid #eee; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-peblux navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header"><a href="home.html" class="peblux-nav-logo">P</a></div>
            <ul class="nav navbar-nav">
                <li><a href="home.html">Games</a></li>
                <li><a href="catalog.html" class="active" style="background:#005f99;">Catalog</a></li>
                <li><a href="develop.html">Develop</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-container">
        <div class="sidebar">
            <ul>
                <li><a href="home.html"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="catalog.html" class="active"><i class="fa fa-shopping-cart"></i> Catalog</a></li>
                <li><a href="develop.html"><i class="fa fa-cogs"></i> Develop</a></li>
            </ul>
        </div>

        <div class="content-area">
            <h2 style="font-weight:300; margin-bottom:20px;">Catalog - User Creations</h2>
            <div class="catalog-grid" id="catalogGrid">
                <p style="color:#777;">Loading catalog items...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadCatalog() {
            const { data: items } = await supabaseClient.from('items').select('*').order('created_at', { ascending: false });
            const grid = document.getElementById('catalogGrid');

            if (!items || items.length === 0) {
                grid.innerHTML = `<p style="color:#777;">No items in the catalog yet. Go to Develop to upload one!</p>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <a href="item.html?id=${item.id}" class="item-card">
                    <img src="${item.image_url}" alt="${item.name}">
                    <div style="font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
                    <div style="color:#00b06f; font-weight:bold; font-size:13px; margin-top:5px;">${item.price} Robux</div>
                </a>
            `).join('');
        }

        loadCatalog();
    </script>
</body>
</html>
