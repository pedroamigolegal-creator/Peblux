<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - Peblux</title>
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon"/>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #e3e3e3; margin: 0; padding-top: 40px; }
        .navbar-peblux { background-color: #0074bd; border: none; min-height: 40px; height: 40px; }
        .peblux-nav-logo { font-family: 'Arial Black', Impact, sans-serif; font-size: 20px; font-weight: 900; font-style: italic; color: #da291c; background: #fff; padding: 0px 7px; border: 2px solid #da291c; border-radius: 3px; margin-top: 5px; display: inline-block; text-decoration: none !important; }
        .navbar-peblux .nav > li > a { color: white; font-weight: 600; padding: 10px 15px; }
        .currency-badge { color: white; font-weight: 600; line-height: 40px; margin-right: 15px; font-size: 14px; }
        .currency-badge span { margin-left: 3px; margin-right: 10px; }
        .main-container { display: flex; min-height: calc(100vh - 40px); }
        .sidebar { width: 175px; background: #fff; border-right: 1px solid #d0d0d0; padding-top: 10px; flex-shrink: 0; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; padding: 8px 15px; color: #191919; text-decoration: none; font-size: 15px; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background-color: #f2f2f2; color: #0074bd; font-weight: 600; }
        .sidebar ul li a i { margin-right: 10px; width: 18px; text-align: center; }
        .content-area { flex-grow: 1; padding: 20px 30px; max-width: 1050px; }
        .profile-banner { width: 100%; height: 160px; background: #222 url('http://images.rbxcdn.com/cca69eca62f23ca413fc920549e936ea.jpg') center/cover; border-radius: 4px; margin-bottom: 20px; }
        .profile-card { background: #fff; border: 1px solid #ccc; padding: 25px; border-radius: 4px; display: flex; align-items: center; margin-bottom: 20px; }
        #profileHeadshot { width: 130px; height: 130px; border-radius: 50%; background: #eee; border: 1px solid #ccc; margin-right: 25px; overflow: hidden; flex-shrink: 0; }
        .profile-tabs { display: flex; border-bottom: 2px solid #0074bd; margin-bottom: 20px; }
        .profile-tab { padding: 10px 25px; font-weight: 600; cursor: pointer; color: #555; text-decoration: none; border-bottom: 3px solid transparent; }
        .profile-tab.active { border-bottom-color: #0074bd; color: #0074bd; }
        .tab-content { background: #fff; border: 1px solid #ccc; padding: 25px; border-radius: 4px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-peblux navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header"><a href="home.html" class="peblux-nav-logo">P</a></div>
            <ul class="nav navbar-nav">
                <li><a href="home.html">Games</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="develop.html">Develop</a></li>
            </ul>
            <ul class="nav navbar-nav navbar-right">
                <li>
                    <span class="currency-badge">
                        <i class="fa fa-stop-circle" style="color:#00b06f;"></i> <span id="userRobux">100</span>
                        <i class="fa fa-ticket" style="color:#e2a03f; margin-left: 5px;"></i> <span id="userTix">0</span>
                    </span>
                </li>
            </ul>
        </div>
    </nav>

    <div class="main-container">
        <div class="sidebar">
            <ul>
                <li><a href="home.html"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="profile.html" class="active"><i class="fa fa-user"></i> Profile</a></li>
                <li><a href="messages.html"><i class="fa fa-envelope-o"></i> Messages</a></li>
                <li><a href="friends.html"><i class="fa fa-users"></i> Friends</a></li>
                <li><a href="avatar.html"><i class="fa fa-male"></i> Avatar</a></li>
            </ul>
        </div>

        <div class="content-area">
            <div class="profile-banner"></div>
            <div class="profile-card">
                <div id="profileHeadshot"></div>
                <div>
                    <h2 id="profileUsername" style="margin:0 0 5px 0; font-weight:700;">Username</h2>
                    <p style="color:#666; margin:0;">@<span id="usernameHandle">username</span></p>
                    <div style="margin-top: 15px; display: flex; gap: 30px; font-weight: 600; color: #0074bd;">
                        <div>Friends <span id="friendsCount" style="color:#333; display:block;">0</span></div>
                        <div>Followers <span style="color:#333; display:block;">0</span></div>
                        <div>Following <span style="color:#333; display:block;">0</span></div>
                    </div>
                </div>
            </div>

            <div class="profile-tabs">
                <a href="#" class="profile-tab active">About</a>
                <a href="#" class="profile-tab">Creations</a>
            </div>

            <div class="tab-content">
                <h4 style="margin-top:0;">About</h4>
                <p style="color: #666;">This user hasn't written a bio yet.</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProfile() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }

            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            if (profile) {
                document.getElementById('userRobux').innerText = profile.robux;
                document.getElementById('profileUsername').innerText = profile.username;
                document.getElementById('usernameHandle').innerText = profile.username.toLowerCase();
                
                // Renderiza busto 3D igual ao da home
                renderHeadshot({
                    head: profile.head_color || '#F5CD30',
                    torso: profile.torso_color || '#9BA0A5',
                    leftArm: profile.left_arm_color || '#F5CD30',
                    rightArm: profile.right_arm_color || '#F5CD30'
                });
            }
        }

        function renderHeadshot(colors) {
            const container = document.getElementById('profileHeadshot');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
            camera.position.set(1.3, 1.45, 2.3);
            camera.lookAt(0, 1.35, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(130, 130);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.75));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.45);
            dirLight.position.set(3, 5, 4);
            scene.add(dirLight);

            const faceCanvas = document.createElement('canvas');
            faceCanvas.width = 128; faceCanvas.height = 128;
            const ctx = faceCanvas.getContext('2d');
            ctx.fillStyle = colors.head;
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#111111';
            ctx.beginPath(); ctx.ellipse(44, 50, 5, 9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(84, 50, 5, 9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 5; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(64, 66, 20, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

            const faceTexture = new THREE.CanvasTexture(faceCanvas);
            const headMat = new THREE.MeshLambertMaterial({ color: colors.head });
            const headMaterials = [headMat, headMat, headMat, headMat, new THREE.MeshLambertMaterial({ map: faceTexture }), headMat];

            scene.add(new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.72, 0.72), headMaterials)).position.set(0, 1.55, 0);
            scene.add(new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 0.55), new THREE.MeshLambertMaterial({ color: colors.torso }))).position.set(0, 0.6, 0);
            scene.add(new THREE.Mesh(new THREE.BoxGeometry(0.52, 1.1, 0.55), new THREE.MeshLambertMaterial({ color: colors.leftArm }))).position.set(-0.83, 0.6, 0);
            scene.add(new THREE.Mesh(new THREE.BoxGeometry(0.52, 1.1, 0.55), new THREE.MeshLambertMaterial({ color: colors.rightArm }))).position.set(0.83, 0.6, 0);

            renderer.render(scene, camera);
        }

        loadProfile();
    </script>
</body>
</html>
