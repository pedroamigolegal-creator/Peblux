<!DOCTYPE html>
<html>
<head>
    <title>Peblux - Official 2016 Revival</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,requiresActiveX=true">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon" type="image/png">
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,500,600,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    
    <!-- SDK do Supabase e jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

    <style>
        .coverSprite { background-repeat: no-repeat; background-image: url('https://images.rbxcdn.com/20e7d1543d2c5caf201184d86530fc35.png'); }
        #RollerContainer { background-image: url('https://images.rbxcdn.com/dcbdfaf1c08058e71f65c09f7b98ff04.jpg'); background-repeat: no-repeat; background-size: cover; min-height: 600px; padding: 60px 0; position: relative; }
        #InnerWhatsRobloxContainer1 { height: 70%; background-image: url('https://images.rbxcdn.com/cca69eca62f23ca413fc920549e936ea.jpg'); background-repeat: no-repeat; background-size: cover; background-position: 30% center; color: white; }
        #GameImage1 { background-image: url('https://images.rbxcdn.com/42268b6264d89827401ef912f174f288.jpg'); }
        #GameImage2 { background-image: url('https://images.rbxcdn.com/04baeb33ef66ef1395cd5464309fece6.jpg'); }
        #GameImage3 { background-image: url('https://images.rbxcdn.com/e8b89d14690203420d64b5b2fda0b461.jpg'); }
        .game-image { height: 220px; background-size: cover; background-position: center; border-radius: 4px; margin-bottom: 15px; }
        #SignUpFormContainer { background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .input-field { border-radius: 0 !important; height: 42px !important; }
        .signup-submit-button { background-color: #00b06f !important; color: white !important; font-weight: bold; width: 100%; height: 45px; border: none; border-radius: 0; }
        .signup-submit-button:hover { background-color: #00965d !important; }
        #LoginButton { background-color: #0074bd; color: white; font-weight: bold; border-radius: 0; }
        .attribution { position: absolute; bottom: 15px; right: 20px; color: white; background: rgba(0, 0, 0, 0.6); padding: 6px 12px; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body id="rbx-body">

    <!-- Redireciona se já estiver logado -->
    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) { window.location.href = 'home.html'; }
        });
    </script>

    <div class="navbar navbar-landing navbar-fixed-top" role="navigation" style="background-color: rgba(0, 0, 0, 0.35);">
        <div class="container">
            <div class="row">
                <div class="navbar-header col-md-6">
                    <div class="navbar-brand"><span style="color:white; font-weight:900; font-style:italic; font-size:24px; background:#da291c; padding:2px 8px; border-radius:4px;">P</span></div>
                </div>
                <!-- Formulário de Login Clássico -->
                <div class="col-sm-6">
                    <form id="loginForm" class="navbar-form form-inline navbar-right" onsubmit="handleLogin(event)">
                        <div class="form-group"><input id="loginUsername" type="text" placeholder="Username" class="form-control" required></div>
                        <div class="form-group"><input id="loginPassword" type="password" placeholder="Password" class="form-control" required></div>
                        <div class="form-group"><button type="submit" id="LoginButton" class="form-control btn">Log In</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <!-- Roller Coaster / Seção de Cadastro -->
        <section class="row full-height-section" id="RollerContainer">
            <div class="col-md-12 inner-full-height-section">
                <div class="row">
                    <div class="col-xs-12 col-md-6 text-center" style="margin-top: 80px;">
                        <h1 style="font-family:'Arial Black',sans-serif; font-size:64px; font-style:italic; color:white; text-shadow: -3px -3px 0 #da291c, 3px -3px 0 #da291c, -3px 3px 0 #da291c, 3px 3px 0 #da291c;">PEBLUX</h1>
                        <h2 style="color:white; font-weight:700;">Powering Imagination</h2>
                    </div>

                    <div class="col-xs-12 col-md-6">
                        <div id="SignUpFormContainer">
                            <h3 class="text-center" style="font-weight:700; margin-bottom:20px;">Sign up and start having fun!</h3>
                            <form id="signupForm" onsubmit="handleSignup(event)">
                                <div class="form-group"><input id="signupUsername" class="form-control input-field" type="text" placeholder="Username" required></div>
                                <div class="form-group"><input id="signupPassword" class="form-control input-field" type="password" placeholder="Password (min 6 chars)" required></div>
                                <div class="form-group"><input id="signupPasswordConfirm" class="form-control input-field" type="password" placeholder="Confirm Password" required></div>
                                <p id="signupError" class="text-danger" style="font-size:13px;"></p>
                                <button type="submit" class="btn signup-submit-button">Sign Up</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="attribution hidden-xs">
                <span>Game: Peblux Point</span><br>
                Developer: <span>Pedro Augusto</span>
            </div>
        </section>

        <!-- What is Peblux -->
        <section class="row full-height-section" id="WhatsRobloxContainer" style="background:#f2f2f2; padding:50px 0;">
            <div class="container">
                <div class="row" id="InnerWhatsRobloxContainer1" style="padding:40px; border-radius:6px; margin-bottom:30px;">
                    <div class="col-sm-6 col-sm-offset-6" style="background:rgba(0,0,0,0.75); padding:30px; border-radius:6px;">
                        <h2 class="text-center">WHAT IS PEBLUX?</h2>
                        <p class="lead">Peblux is the ultimate online gaming platform where virtual explorers create adventures and play with friends in an immersive 3D environment.</p>
                    </div>
                </div>
                <div class="row">
                    <div id="GameImage1" class="col-sm-4 game-image"></div>
                    <div id="GameImage2" class="col-sm-4 game-image"></div>
                    <div id="GameImage3" class="col-sm-4 game-image"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Lógica de Conexão Supabase para Login e Cadastro -->
    <script>
        async function handleSignup(event) {
            event.preventDefault();
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupPasswordConfirm').value;
            const errorElement = document.getElementById('signupError');

            errorElement.innerText = "";
            if (password !== confirmPassword) {
                errorElement.innerText = "As senhas não coincidem!";
                return;
            }

            const fakeEmail = `${username.toLowerCase()}@peblux.local`;

            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: fakeEmail,
                password: password,
                options: { data: { username: username } }
            });

            if (authError) {
                errorElement.innerText = authError.message;
                return;
            }

            if (authData.user) {
                // Cria o perfil com cores padrão do Noob e saldo inicial
                await supabaseClient.from('profiles').insert([{ 
                    id: authData.user.id, 
                    username: username, 
                    robux: 100,
                    head_color: '#F5CD30',
                    torso_color: '#9BA0A5',
                    left_arm_color: '#F5CD30',
                    right_arm_color: '#F5CD30',
                    left_leg_color: '#A4BD47',
                    right_leg_color: '#A4BD47'
                }]);

                // Envia a mensagem automática de boas-vindas do sistema
                await supabaseClient.from('messages').insert([{
                    user_id: authData.user.id,
                    sender: 'System',
                    subject: 'Welcome to Peblux!',
                    body: 'Welcome to Peblux!! Thanks for playing my revival.'
                }]);
            }

            alert("Conta criada com sucesso! Faça login.");
            location.reload();
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const fakeEmail = `${username.toLowerCase()}@peblux.local`;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                email: fakeEmail, 
                password: password 
            });

            if (error) {
                alert("Erro ao entrar: Verifique seu usuário e senha.");
            } else {
                window.location.href = "home.html";
            }
        }
    </script>
</body>
</html>
