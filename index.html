<!DOCTYPE html>
<html lang="en">
<head>
    <title>Peblux - Official 2016 Revival</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,requiresActiveX=true">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon" type="image/png">
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    
    <!-- Supabase SDK e jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

    <!-- Script de verificação de sessão (Redireciona se já estiver logado) -->
    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) { window.location.href = 'home.html'; }
        });
    </script>

    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #232527; color: #fff; margin: 0; padding-top: 50px; }
        .navbar-landing { background-color: rgba(0, 0, 0, 0.5); border-bottom: 1px solid rgba(255,255,255,0.1); min-height: 50px; z-index: 1000; }
        .navbar-right-form { margin-top: 8px; }
        .navbar-right-form .form-control { border-radius: 0; height: 34px; background: #fff; color: #333; }
        #LoginButton { background-color: #0074BD; color: white; font-weight: bold; border: none; border-radius: 0; height: 34px; }
        #LoginButton:hover { background-color: #005f99; }
        
        #RollerContainer {
            background-image: url('http://images.rbxcdn.com/dcbdfaf1c08058e71f65c09f7b98ff04.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            min-height: 600px;
            padding: 60px 0;
            position: relative;
        }
        
        #SignUpFormContainer {
            background: rgba(35, 37, 39, 0.95);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #444;
        }
        .input-field { border-radius: 0 !important; height: 42px !important; background: #fff !important; color: #333 !important; }
        .signup-submit-button { background-color: #00b06f; color: white; font-weight: bold; font-size: 16px; width: 100%; height: 45px; border: none; border-radius: 0; }
        .signup-submit-button:hover { background-color: #00965d; }
        
        .attribution { position: absolute; bottom: 15px; right: 20px; color: white; background: rgba(0, 0, 0, 0.7); padding: 6px 12px; border-radius: 4px; font-size: 13px; }
        footer { background: #1a1a1a; padding: 30px 0; color: #888; font-size: 13px; margin-top: 40px; }
        footer a { color: #aaa; text-decoration: none; }
        footer a:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body id="rbx-body">

<!-- Navbar Superior com Login -->
<div class="navbar navbar-landing navbar-fixed-top" role="navigation">
    <div class="container">
        <div class="row">
            <div class="navbar-header col-md-5">
                <a class="navbar-brand" href="#" style="color:white; font-weight:900; font-style:italic; font-size:24px; text-decoration:none;">PEBLUX</a>
            </div>
            <div class="col-md-7 text-right">
                <form id="LogInForm" class="navbar-form form-inline navbar-right navbar-right-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <input id="LoginUsername" type="text" placeholder="Username" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <input id="LoginPassword" type="password" placeholder="Password" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <input type="submit" id="LoginButton" class="form-control btn" value="Log In" />
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid" style="padding:0;">
    <!-- Seção da Montanha-Russa e Cadastro -->
    <section class="row full-height-section" id="RollerContainer">
        <div class="container">
            <div class="row" style="align-items: center; display: flex; flex-wrap: wrap;">
                <div class="col-xs-12 col-md-6 text-center">
                    <h1 style="font-family:'Arial Black',sans-serif; font-size:64px; font-style:italic; color:white; text-shadow: -3px -3px 0 #da291c, 3px -3px 0 #da291c, -3px 3px 0 #da291c, 3px 3px 0 #da291c;">PEBLUX</h1>
                    <h2 style="color:white; font-weight:700; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Powering Imagination</h2>
                </div>

                <!-- Formulário de Cadastro Exato da Base -->
                <div class="col-xs-12 col-md-6">
                    <div id="SignUpFormContainer">
                        <h3 class="text-center" style="font-weight:700; margin-bottom:20px; color:white;">Sign up and start having fun!</h3>
                        <form id="actualSignupForm" onsubmit="handleSignup(event)">
                            <div class="form-group">
                                <label style="color:#ccc; font-weight:600;">Username</label>
                                <input id="signup-username" class="form-control input-field" type="text" placeholder="Don't use your real name" required />
                            </div>
                            <div class="form-group">
                                <label style="color:#ccc; font-weight:600;">Password</label>
                                <input id="signup-password" class="form-control input-field" type="password" placeholder="At least 6 characters" required />
                            </div>
                            <div class="form-group">
                                <label style="color:#ccc; font-weight:600;">Confirm Password</label>
                                <input id="signup-password-confirm" class="form-control input-field" type="password" placeholder="Confirm Password" required />
                            </div>
                            <p id="signupError" class="text-danger" style="font-weight:600; font-size:13px; text-align:center; margin-top:10px;"></p>
                            <button id="signup-button" type="submit" class="btn signup-submit-button" style="margin-top:10px;">Sign Up</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="attribution hidden-xs">
            <span>Game: Peblux Point</span><br>
            Developer: <span>Pedro Augusto</span>
        </div>
    </section>
</div>

<footer>
    <div class="container text-center">
        <p>Peblux is an independent fan-made revival and is not affiliated with, endorsed by, or connected to Roblox Corporation.</p>
    </div>
</footer>

<!-- Lógica de Autenticação Supabase Integrada -->
<script>
    async function handleSignup(event) {
        event.preventDefault();
        const username = document.getElementById('signup-username').value.trim();
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-password-confirm').value;
        const errorElement = document.getElementById('signupError');

        errorElement.innerText = "";
        if (password !== confirmPassword) {
            errorElement.innerText = "As senhas não coincidem!";
            return;
        }

        const fakeEmail = `${username.toLowerCase()}@peblux.local`;

        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
            email: fakeEmail,
            password: password,
            options: { data: { username: username } }
        });

        if (authError) {
            errorElement.innerText = authError.message;
            return;
        }

        if (authData.user) {
            // Cria o perfil com cores padrão do Noob e 100 Robux
            await supabaseClient.from('profiles').insert([{ 
                id: authData.user.id, 
                username: username, 
                robux: 100,
                head_color: '#F5CD30',
                torso_color: '#9BA0A5',
                left_arm_color: '#F5CD30',
                right_arm_color: '#F5CD30',
                left_leg_color: '#A4BD47',
                right_leg_color: '#A4BD47'
            }]);

            // Envia mensagem automática de boas-vindas
            await supabaseClient.from('messages').insert([{
                user_id: authData.user.id,
                sender: 'System',
                subject: 'Welcome to Peblux!',
                body: 'Welcome to Peblux!! Thanks for playing my revival.'
            }]);

            // Faz o login automático e redireciona direto para a home
            await supabaseClient.auth.signInWithPassword({ 
                email: fakeEmail, 
                password: password 
            });

            window.location.href = "home.html";
        }
    }

    async function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('LoginUsername').value.trim();
        const password = document.getElementById('LoginPassword').value;
        const fakeEmail = `${username.toLowerCase()}@peblux.local`;

        const { data, error } = await supabaseClient.auth.signInWithPassword({ 
            email: fakeEmail, 
            password: password 
        });

        if (error) {
            alert("Erro ao entrar: Verifique seu usuário e senha.");
        } else {
            window.location.href = "home.html";
        }
    }
</script>
</body>
</html>
