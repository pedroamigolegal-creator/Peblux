<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox (2020 Era) - Início</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Gotham', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .landing-card {
            background-color: #232323;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-signup {
            background-color: #00b06f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
        }
        .btn-signup:hover {
            background-color: #009c62;
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <h1>Imagine, Crie e Jogue</h1>
        <p>A nova geração de entretenimento imersivo de 2020 espera por você.</p>
        
        <!-- Formulário ou botão inicial simulando a landing page de 2020 -->
        <a href="home.html" class="btn-signup">Cadastre-se / Entrar</a>
    </div>

</body>
</html>
