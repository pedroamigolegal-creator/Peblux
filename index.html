<!DOCTYPE html>
<html lang="en">
<head>
    <title>Peblux - Official 2016 Revival</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="40052.png" rel="icon" type="image/png" />
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) { window.location.href = 'home.html'; }
        });
    </script>

    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #e3e3e3; margin: 0; padding-top: 50px; }
        .navbar-landing { background-color: rgba(0, 0, 0, 0.5); border-bottom: 1px solid rgba(0,0,0,0.3); min-height: 50px; z-index: 1000; }
        .navbar-right-form { margin-top: 8px; }
        .navbar-right-form .form-control { border-radius: 0; height: 34px; font-size: 14px; }
        #LoginButton { background-color: #0074BD; color: white; font-weight: bold; border: none; border-radius: 0; height: 34px; padding: 0 16px; }
        #LoginButton:hover { background-color: #005f99; }
        
        #RollerContainer {
            background-image: url('http://images.rbxcdn.com/dcbdfaf1c08058e71f65c09f7b98ff04.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            min-height: 600px;
            padding: 70px 0;
            position: relative;
        }
        #SignUpFormContainer {
            background: rgba(255, 255, 255, 0.96);
            padding: 25px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            max-width: 420px;
            margin: 0 auto;
        }
        .input-field { border-radius: 0 !important; height: 42px !important; font-size: 15px; }
        .signup-submit-button { background-color: #00b06f; color: white; font-weight: bold; font-size: 17px; width: 100%; height: 44px; border: none; border-radius: 0; margin-top: 5px; }
        .signup-submit-button:hover { background-color: #00965d; }
        .attribution { position: absolute; bottom: 12px; right: 20px; color: white; background: rgba(0, 0, 0, 0.65); padding: 6px 12px; border-radius: 4px; font-size: 13px; }
        
        #WhatsRobloxContainer { background: #191919; padding: 45px 0; color: white; }
        #InnerWhatsRobloxContainer1 {
            background-image: url('http://images.rbxcdn.com/cca69eca62f23ca413fc920549e936ea.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            padding: 40px;
            border-radius: 4px;
        }
        .text-bg-box { background: rgba(0, 0, 0, 0.8); padding: 25px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="navbar navbar-landing navbar-fixed-top" role="navigation">
    <div class="container">
        <div class="row">
            <div class="navbar-header col-md-5">
                <div class="navbar-brand hidden-xs" style="padding: 5px 15px;">
                    <img alt="Peblux Logo" src="40052.png" style="max-height: 32px;" />
                </div>
                <ul class="nav navbar-nav" style="display:inline-block; margin-left: 10px;">
                    <li style="display:inline-block;"><a href="#RollerContainer" style="color:white; font-weight:600;">Play</a></li>
                    <li style="display:inline-block;"><a href="#WhatsRobloxContainer" style="color:white; font-weight:600;">About</a></li>
                </ul>
            </div>
            
            <div class="col-md-7 text-right">
                <form id="LogInForm" class="navbar-form form-inline navbar-right navbar-right-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <input id="LoginUsername" type="text" placeholder="Username" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <input id="LoginPassword" type="password" placeholder="Password" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <button type="submit" id="LoginButton" class="form-control btn">Log In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<section id="RollerContainer">
    <div class="container">
        <div class="row" style="display: flex; align-items: center; flex-wrap: wrap;">
            <div class="col-xs-12 col-md-6 text-center" style="margin-bottom: 30px;">
                <img title="Peblux" class="center-block img-responsive" src="40051.png" style="max-width: 420px; margin: 0 auto 10px auto;" />
                <h2 style="color: white; font-weight: 700; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); margin: 0; font-style: italic;">Powering Imagination</h2>
            </div>

            <div class="col-xs-12 col-md-6">
                <div id="SignUpFormContainer">
                    <h3 class="text-center" style="font-weight: 700; margin-top: 0; margin-bottom: 20px; color: #333;">Sign up and start having fun!</h3>
                    <form id="actualSignupForm" onsubmit="handleSignup(event)">
                        <div class="form-group">
                            <input id="signup-username" class="form-control input-field" type="text" placeholder="Username (3-20 chars)" required />
                        </div>
                        <div class="form-group">
                            <input id="signup-password" class="form-control input-field" type="password" placeholder="Password (min 6 chars)" required />
                        </div>
                        <div class="form-group">
                            <input id="signup-password-confirm" class="form-control input-field" type="password" placeholder="Confirm Password" required />
                        </div>
                        <p id="signupError" class="text-danger" style="font-weight:600; font-size:13px; text-align:center;"></p>
                        <button id="signup-button" type="submit" class="btn signup-submit-button">Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="attribution hidden-xs">
        <span>Game: Peblux Point</span><br>
        Developer: <span>Pedro Augusto</span>
    </div>
</section>

<section id="WhatsRobloxContainer">
    <div class="container">
        <div class="row" id="InnerWhatsRobloxContainer1">
            <div class="col-sm-6 col-sm-offset-6">
                <div class="text-bg-box">
                    <h2 class="text-center" style="font-weight: 700; margin-top: 0;">WHAT IS PEBLUX?</h2>
                    <p class="lead" style="font-size: 15px; text-align: justify; margin-bottom: 0;">
                        Peblux is the ultimate online gaming platform where virtual explorers create adventures, play games, and role play with friends in an immersive 3D environment.
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    async function handleSignup(event) {
        event.preventDefault();
        const username = document.getElementById('signup-username').value.trim();
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-password-confirm').value;
        const errorElement = document.getElementById('signupError');

        errorElement.innerText = "";
        if (password !== confirmPassword) {
            errorElement.innerText = "As senhas não coincidem!";
            return;
        }

        const fakeEmail = `${username.toLowerCase()}@peblux.local`;

        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
            email: fakeEmail,
            password: password,
            options: { data: { username: username } }
        });

        if (authError) {
            errorElement.innerText = authError.message;
            return;
        }

        if (authData.user) {
            // Cadastra com 150 Robux iniciais conforme pedido
            await supabaseClient.from('profiles').insert([{ 
                id: authData.user.id, 
                username: username, 
                robux: 150,
                head_color: '#F5CD30',
                torso_color: '#9BA0A5',
                left_arm_color: '#F5CD30',
                right_arm_color: '#F5CD30',
                left_leg_color: '#A4BD47',
                right_leg_color: '#A4BD47'
            }]);

            await supabaseClient.from('messages').insert([{
                user_id: authData.user.id,
                sender: 'System',
                subject: 'Welcome to Peblux!',
                body: 'Welcome to Peblux!! Thanks for playing my revival.'
            }]);

            await supabaseClient.auth.signInWithPassword({ 
                email: fakeEmail, 
                password: password 
            });

            window.location.href = "home.html";
        }
    }

    async function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('LoginUsername').value.trim();
        const password = document.getElementById('LoginPassword').value;
        const fakeEmail = `${username.toLowerCase()}@peblux.local`;

        const { data, error } = await supabaseClient.auth.signInWithPassword({ 
            email: fakeEmail, 
            password: password 
        });

        if (error) {
            alert("Erro ao entrar: Verifique seu usuário e senha.");
        } else {
            window.location.href = "home.html";
        }
    }
</script>
</body>
</html>
