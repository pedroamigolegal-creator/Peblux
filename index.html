<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox (2020) - Cadastre-se</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gotham', 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        .signup-container {
            max-width: 480px;
            width: 100%;
            margin: 60px auto;
            background: #1f1f1f;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-area h1 {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1px;
            color: #ffffff;
        }
        .logo-area p {
            color: #b0b0b0;
            font-size: 15px;
            margin-top: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #d0d0d0;
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-size: 15px;
        }
        input:focus, select:focus {
            border-color: #00b06f;
            outline: none;
        }
        .birthday-row {
            display: flex;
            gap: 10px;
        }
        .gender-row {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .gender-btn {
            flex: 1;
            padding: 10px;
            background: #2b2b2b;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .gender-btn:hover {
            border-color: #666;
        }
        .btn-submit {
            width: 100%;
            background-color: #00b06f;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #009c62;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="logo-area">
            <h1>ROBLOX</h1>
            <p>Cadastre-se para criar e jogar com milhões de pessoas</p>
        </div>

        <form action="home.html" method="GET">
            <div class="form-group">
                <label>ANIVERSÁRIO</label>
                <div class="birthday-row">
                    <select required>
                        <option value="">Mês</option>
                        <option>Janeiro</option><option>Fevereiro</option><option>Março</option><option>Abril</option><option>Maio</option><option>Junho</option><option>Julho</option><option>Agosto</option><option>Setembro</option><option>Outubro</option><option>Novembro</option><option>Dezembro</option>
                    </select>
                    <select required>
                        <option value="">Dia</option>
                        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                    </select>
                    <select required>
                        <option value="">Ano</option>
                        <option>2010</option><option>2008</option><option>2005</option><option>2000</option><option>1995</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>NOME DE USUÁRIO</label>
                <input type="text" placeholder="Não use seu nome real" required>
            </div>

            <div class="form-group">
                <label>SENHA</label>
                <input type="password" placeholder="No mínimo 8 caracteres" required>
            </div>

            <div class="form-group">
                <label>GÊNERO (OPCIONAL)</label>
                <div class="gender-row">
                    <button type="button" class="gender-btn">Masculino</button>
                    <button type="button" class="gender-btn">Feminino</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Cadastre-se</button>
        </form>
    </div>

    <footer>
        &copy; 2020 Roblox Corporation (Revival Project)
    </footer>

</body>
</html>
