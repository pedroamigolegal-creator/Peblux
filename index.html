<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peblux - Official 2016 Revival</title>
    <link href="http://images.rbxcdn.com/9c0e562131139fc909c6fbb3d691c249.ico.gzip" rel="icon"/>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,500,600,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #e3e3e3; margin: 0; padding-top: 50px; }
        .navbar-landing { background-color: #ffffff; border-bottom: 1px solid #ccc; min-height: 50px; }
        .peblux-navbar-brand { display: inline-block; margin-top: 6px; text-decoration: none; }
        .peblux-nav-logo { font-family: 'Arial Black', Impact, sans-serif; font-size: 24px; font-weight: 900; font-style: italic; color: #da291c; text-transform: uppercase; letter-spacing: -1px; text-shadow: 2px 2px 0px #fff, 3px 3px 0px rgba(0,0,0,0.2); background: #fff; padding: 2px 8px; border: 2px solid #da291c; border-radius: 4px; }
        .navbar-nav > li > a { color: #111; font-weight: 600; font-size: 15px; padding: 15px 15px; }
        .navbar-form { margin-top: 8px; }
        .navbar-form .form-control { border-radius: 0; height: 34px; }
        #LoginButton { background-color: #0074bd; color: white; border: none; font-weight: bold; }
        #RollerContainer { background-image: url('http://images.rbxcdn.com/dcbdfaf1c08058e71f65c09f7b98ff04.jpg'); background-size: cover; background-position: center; min-height: 600px; padding: 60px 0; position: relative; }
        .peblux-main-logo { font-family: 'Arial Black', Impact, sans-serif; font-size: 64px; font-weight: 900; font-style: italic; color: #ffffff; text-transform: uppercase; text-align: center; text-shadow: -3px -3px 0 #da291c, 3px -3px 0 #da291c, -3px 3px 0 #da291c, 3px 3px 0 #da291c; margin: 0 auto 10px auto; }
        #SignUpFormContainer { background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-width: 420px; margin: 0 auto; }
        .input-field { border-radius: 0 !important; height: 42px !important; }
        .signup-submit-button { background-color: #00b06f; color: white; font-weight: bold; font-size: 18px; width: 100%; height: 45px; border: none; border-radius: 0; margin-top: 10px; }
        .error-msg { color: #d9534f; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="navbar navbar-landing navbar-fixed-top" role="navigation">
        <div class="container">
            <div class="row">
                <div class="navbar-header col-md-6">
                    <div class="navbar-brand"><a href="#" class="peblux-navbar-brand"><span class="peblux-nav-logo">P</span></a></div>
                </div>
                <div class="col-sm-6">
                    <form id="loginForm" class="navbar-form navbar-right" onsubmit="handleLogin(event)">
                        <div class="form-group"><input type="text" id="loginUsername" placeholder="Username" class="form-control" required /></div>
                        <div class="form-group"><input type="password" id="loginPassword" placeholder="Password" class="form-control" required /></div>
                        <div class="form-group"><button type="submit" id="LoginButton" class="form-control btn">Log In</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <section id="RollerContainer">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center">
                    <div style="margin-top: 80px;">
                        <div class="peblux-main-logo">PEBLUX</div>
                        <h1 style="color:white; font-weight:700;">Powering Imagination</h1>
                    </div>
                </div>
                <div class="col-md-6">
                    <div id="SignUpFormContainer">
                        <h3 class="text-center" style="font-weight:700; margin-bottom:20px;">Sign up and start having fun!</h3>
                        <form id="signupForm" onsubmit="handleSignup(event)">
                            <div class="form-group"><input id="signupUsername" class="form-control input-field" type="text" placeholder="Username" required /></div>
                            <div class="form-group"><input id="signupPassword" class="form-control input-field" type="password" placeholder="Password" required /></div>
                            <div class="form-group"><input id="signupPasswordConfirm" class="form-control input-field" type="password" placeholder="Confirm Password" required /></div>
                            <div class="error-msg" id="signupError"></div>
                            <button type="submit" class="btn signup-submit-button">Sign Up</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://rdsezvmtrnfgjithodjc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QKfwvR6GsiiDaTMG-pigGA_Y9QinL7l';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleSignup(event) {
            event.preventDefault();
            const username = document.getElementById('signupUsername').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupPasswordConfirm').value;
            const errorElement = document.getElementById('signupError');

            if (password !== confirmPassword) {
                errorElement.innerText = "As senhas não coincidem!";
                return;
            }

            const fakeEmail = `${username.toLowerCase()}@peblux.local`;

            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: fakeEmail,
                password: password,
                options: { data: { username: username } }
            });

            if (authError) {
                errorElement.innerText = authError.message;
                return;
            }

            if (authData.user) {
                // Cria o perfil
                await supabaseClient.from('profiles').insert([{ id: authData.user.id, username: username, robux: 100 }]);

                // Envia a mensagem automática de boas-vindas
                await supabaseClient.from('messages').insert([{
                    user_id: authData.user.id,
                    sender: 'System',
                    subject: 'Welcome to Peblux!',
                    body: 'Welcome to Peblux!! Thanks for playing my revival.'
                }]);
            }

            alert("Conta criada com sucesso! Faça login.");
            location.reload();
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const fakeEmail = `${username.toLowerCase()}@peblux.local`;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: fakeEmail, password: password });
            if (error) {
                alert("Erro ao entrar: Verifique seu usuário e senha.");
            } else {
                window.location.href = "home.html";
            }
        }
    </script>
</body>
</html>
